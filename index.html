<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EMS</title>

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/lucide@1.28.0"></script>
        <script src="common.js"></script>

    </head>

    <body>

        <header>

            <section class="relative px-5 md:px-10 py-5 flex flex-row items-center bg-slate-500 text-white">
                <h1 class="grow text-lg md:text-4xl font-bold">Employee Management System</h1>
            </section>

        </header>

        <main class="min-h-[87vh] px-10">

            <section class="flex flex-col gap-2">

                <section class="p-5 flex flex-row gap-2 items-center">

                    <h2 class="grow text-2xl">Employee Table</h2>
                    <button id="filter-employee" type="button" class="w-fit p-2 bg-slate-500 text-white text-center border border-slate-400 rounded-lg hover:bg-slate-600 cursor-pointer"><i data-lucide="funnel"></i></button>
                    <button id="delete-employee" type="button" class="w-1/12 py-2 bg-red-500 text-white text-center border border-red-400 rounded-lg hover:bg-red-600 cursor-pointer hidden">Delete All</button>
                    <button name="add-employee" type="button" class="hidden md:block w-1/12 py-2 bg-slate-500 text-white text-center border border-slate-400 rounded-lg hover:bg-slate-600 cursor-pointer">Add</button>

                </section>

                <form id="filter" method="post" class="mb-5 hidden flex-col gap-5">

                    <section class="grid grid-cols-1 md:grid-cols-6 gap-2">

                        <input type="text" name="name" placeholder="Employee Name" class="px-4 py-2 outline-none ring ring-gray-300 rounded-xl">
                        <select name="department" class="px-4 py-2 outline-none ring ring-gray-300 rounded-xl appearance-none"></select>
                        <select name="designation" class="px-4 py-2 outline-none ring ring-gray-300 rounded-xl appearance-none"></select>
                        <input type="date" name="joining_date" class="px-4 py-2 outline-none ring ring-gray-300 rounded-xl">
                        <input type="text" name="contact" placeholder="Contact" class="px-4 py-2 outline-none ring ring-gray-300 rounded-xl">
                        <input type="text" name="email" placeholder="Email" class="px-4 py-2 outline-none ring ring-gray-300 rounded-xl">

                    </section>

                    <section class="flex flex-row gap-5">

                        <button id="btn-filter" type="submit" class="w-1/4 md:w-1/12 py-2 bg-slate-500 text-white text-center border border-slate-400 rounded-lg hover:bg-slate-600 cursor-pointer">Search</button>
                        <button id="btn-reset" type="reset" class="w-1/4 md:w-1/12 py-2 bg-slate-500 text-white text-center border border-slate-400 rounded-lg hover:bg-slate-600 cursor-pointer">Reset</button>

                    </section>

                </form>

                <button id="sm-delete-employee" type="button" class="hidden md:hidden -mt-2 mb-5 py-2 bg-red-500 text-white text-center border border-red-400 rounded-lg hover:bg-red-600 cursor-pointer">Delete All</button>

                <button name="add-employee" type="button" class="md:hidden -mt-2 mb-5 py-2 bg-slate-500 text-white text-center border border-slate-400 rounded-lg hover:bg-slate-600 cursor-pointer">Add</button>

            </section>

            <section class="max-w-full overflow-x-scroll">

                <section class="w-[78.3rem] md:w-full rounded-t-3xl grid grid-cols-9 bg-black text-white">

                    <section ></section>
                    <section class="col-span-2 py-5 font-semibold flex justify-center items-center">Employee Name</section>
                    <section class="py-5 font-semibold flex justify-center items-center">Department</section>
                    <section class="py-5 font-semibold flex justify-center items-center">Designation</section>
                    <section class="py-5 font-semibold flex justify-center items-center">Joining Date</section>
                    <section class="py-5 font-semibold flex justify-center items-center">Contact No.</section>
                    <section class="col-span-2 py-5 font-semibold flex justify-center items-center">Email</section>

                </section>

                <section id="table-data" class="w-[78.3rem] md:w-full border border-t-0 border-gray-300 rounded-b-3xl flex flex-col overflow-hidden"></section>

            </section>

        </main>

        <footer class="text-lg text-center">@ Created By Pranav Tondlekar.</footer>

    </body>

    <script src="index.js"></script>

    <script> lucide.createIcons(); </script>

</html>
